<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#2563eb" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background rounded rectangle -->
  <rect x="10" y="10" width="180" height="180" rx="24" fill="url(#grad1)" filter="url(#shadow)"/>
  
  <!-- Kanban board representation -->
  <g transform="translate(30, 35)">
    <!-- Column 1: Todo -->
    <rect x="0" y="0" width="44" height="130" rx="8" fill="rgba(255,255,255,0.15)"/>
    <rect x="4" y="4" width="36" height="28" rx="4" fill="rgba(255,255,255,0.9)"/>
    <rect x="4" y="38" width="36" height="28" rx="4" fill="rgba(255,255,255,0.9)"/>
    <rect x="4" y="72" width="36" height="28" rx="4" fill="rgba(255,255,255,0.9)"/>
    
    <!-- Column 2: In Progress -->
    <rect x="52" y="0" width="44" height="130" rx="8" fill="rgba(255,255,255,0.15)"/>
    <rect x="56" y="4" width="36" height="28" rx="4" fill="rgba(255,255,255,0.9)"/>
    <rect x="56" y="38" width="36" height="28" rx="4" fill="rgba(255,255,255,0.9)"/>
    
    <!-- Column 3: Done -->
    <rect x="104" y="0" width="44" height="130" rx="8" fill="rgba(255,255,255,0.15)"/>
    <rect x="108" y="4" width="36" height="28" rx="4" fill="rgba(255,255,255,0.9)"/>
  </g>
  
  <!-- Arrow indicating flow/movement -->
  <g transform="translate(100, 175)" fill="rgba(255,255,255,0.9)">
    <path d="M-15 0 L15 0 M5 -5 L15 0 L5 5" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>